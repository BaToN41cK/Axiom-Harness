[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "axiom"
version = "1.0.0"
description = "AXIOM — Local Intelligence Terminal Workspace. A premium TUI AI client powered by Ollama."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "AXIOM" }]
keywords = ["ollama", "tui", "ai", "terminal", "chat", "local"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "textual>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "pyright>=1.1",
]

[project.scripts]
axiom = "axiom.__main__:main"

[project.urls]
Homepage = "https://github.com/BaToN41cK/Axiom"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
axiom = [
    "frontends/tui/*.tcss",
    "plugins/bundled/*/manifest.json",
    "plugins/bundled/*/plugin.py",
    "plugins/bundled/*/README.md",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "ollama: live checks against a real Ollama server (opt-in: AXIOM_LIVE_OLLAMA=1)",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "DTZ", "ISC", "FLY"]
ignore = [
    # Broad exception handling in UI widgets is intentional: rendering must
    # never crash the app on unexpected data.
    "BLE001",
    # Textual uses mutable class attributes as reactive/attribute defaults.
    "RUF012",
    # Best-effort cleanup blocks: silence is acceptable there.
    "S110",
    # Same intent: silent fallbacks.
    "SIM105",
    # Project prefers explicit if/else blocks over dense ternaries.
    "SIM108",
    # Box-drawing glyphs and typographic separators are intentional.
    "RUF001",
    "RUF002",
    "RUF003",
    # Enum-to-StrEnum migration is left for a later pass.
    "UP042",
    # Keys-hint blocks read better as joined literal lists.
    "FLY002",
]

[tool.ruff.lint.per-file-ignores]
# Grouped-with-comments __all__ blocks are kept intentionally unsorted.
"src/axiom/__init__.py" = ["RUF022"]
# The GUI launcher import must run before the guarded module lookups.
"tests/frontends/test_gui.py" = ["E402"]
