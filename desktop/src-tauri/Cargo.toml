[package]
name = "axiom-desktop"
version = "1.0.0"
description = "AXIOM — Open Local AI Coding Workspace & Agent Harness (desktop shell)"
edition = "2021"

[lib]
name = "axiom_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
strip = true
